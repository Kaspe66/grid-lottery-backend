<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Decentralized Web3 100-cell grid game on The Open Network (TON) powered by GRAM token and TON Connect.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GridLottery">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Grid Lottery — Web3 Game on TON</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <script src="https://unpkg.com/tonweb@0.0.60/dist/tonweb.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <script>
    let tonConnectUI = null;
    
    window.initTonConnect = function() {
      if (!tonConnectUI) {
        tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: window.location.origin + '/tonconnect-manifest.json'
        });
      }
      return tonConnectUI;
    };

    window.openTonConnectModal = async function() {
      if (!tonConnectUI) {
        window.initTonConnect();
      }
      try {
        if (tonConnectUI.connected) {
          await tonConnectUI.openModal();
        } else {
          await tonConnectUI.openModal();
        }
        return true;
      } catch (e) {
        console.error("Error opening TON Connect modal:", e);
        return false;
      }
    };

    window.getConnectedWallet = function() {
      if (tonConnectUI && tonConnectUI.connected) {
          const rawAddress = tonConnectUI.account.address;
          try {
              const address = new window.TonWeb.utils.Address(rawAddress);
              return address.toString(true, true, false); // (isUserFriendly, isUrlSafe, isBounceable=false)
          } catch(e) {
              return rawAddress;
          }
      }
      return null;
    };

    window.disconnectWallet = async function() {
      if (tonConnectUI && tonConnectUI.connected) {
          await tonConnectUI.disconnect();
      }
    };

    window.sendTonTransaction = async function(address, amountNanoStr, memo, errorFundsStr, errorGenericStr) {
      if (!tonConnectUI) {
        window.initTonConnect();
      }
      
      // Проверяем, подключен ли кошелек
      if (!tonConnectUI.connected) {
          try {
              await tonConnectUI.openModal();
          } catch(e) {
              alert("Ошибка открытия кошелька: " + (e.message || e));
              console.error(e);
              return false;
          }
      }
      
      if (!tonConnectUI.connected) {
         console.log("Wallet not connected");
         return false; 
      }
      
      let payloadBase64 = '';
      try {
          const cell = new window.TonWeb.boc.Cell();
          cell.bits.writeUint(0, 32);
          cell.bits.writeString(memo);
          const bocBytes = await cell.toBoc();
          payloadBase64 = window.TonWeb.utils.bytesToBase64(bocBytes);
      } catch (e) {
          console.error("Payload error", e);
          alert("Ошибка формирования комментария");
          return false;
      }

      const transaction = {
          validUntil: Math.floor(Date.now() / 1000) + 360,
          messages: [
              {
                  address: address,
                  amount: amountNanoStr,
                  payload: payloadBase64
              }
          ]
      };

      try {
          const result = await tonConnectUI.sendTransaction(transaction);
          return true;
      } catch (e) {
          const errStr = (e.message || e).toString().toLowerCase();
          if (errStr.includes('reject') || errStr.includes('userdeclined') || errStr.includes('funds')) {
              alert(errorFundsStr || "Транзакция отменена. Убедитесь, что на балансе достаточно средств для перевода и оплаты комиссии сети.");
          } else {
              alert((errorGenericStr || "Ошибка транзакции: ") + (e.message || e));
          }
          console.error(e);
          return false;
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
